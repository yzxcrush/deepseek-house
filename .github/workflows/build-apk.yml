name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34 and build-tools 34
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          eval "export ANDROID_HOME=${ANDROID_HOME}"
          ls "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Asset contract checks
        env:
          DSH_STRICT_CHECKS: "1"
        run: bash scripts/check-assets.sh

      - name: Web layer tests
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            npm test
          fi

      - name: Build APK
        env:
          DSH_STRICT_CHECKS: "1"
        run: bash scripts/build.sh

      - name: Verify APK
        run: |
          APK="dist/DeepSeekHouse-1.0.0.apk"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | head -12
          sha256sum "$APK" | tee dist/DeepSeekHouse-1.0.0.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHouse-apk
          path: |
            dist/DeepSeekHouse-1.0.0.apk
            dist/DeepSeekHouse-1.0.0.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: DeepSeek House v1.0.0
          draft: false
          files: |
            dist/DeepSeekHouse-1.0.0.apk
            dist/DeepSeekHouse-1.0.0.apk.sha256

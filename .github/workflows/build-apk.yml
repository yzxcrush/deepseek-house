name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android platform 34 + build-tools
        run: |
          set -x
          ls "$ANDROID_HOME" || true
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKMANAGER"
          if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" || true
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -z "$BT" ] || [ ! -x "$BT/aapt" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;34.0.0" || true
          fi
          ls -l "$ANDROID_HOME/platforms/android-34/android.jar"
          ls -d "$ANDROID_HOME"/build-tools/*

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Asset contract checks
        env:
          DSH_STRICT_CHECKS: "1"
        run: bash scripts/check-assets.sh

      - name: Web layer tests
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            npm test
          fi

      - name: Build APK
        env:
          DSH_STRICT_CHECKS: "1"
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-34/android.jar
        run: bash scripts/build.sh

      - name: Verify APK
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="dist/DeepSeekHouse-1.2.0.apk"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | head -12
          sha256sum "$APK" | tee dist/DeepSeekHouse-1.2.0.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHouse-apk
          path: |
            dist/DeepSeekHouse-1.2.0.apk
            dist/DeepSeekHouse-1.2.0.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: DeepSeek House v1.2.0
          draft: false
          files: |
            dist/DeepSeekHouse-1.2.0.apk
            dist/DeepSeekHouse-1.2.0.apk.sha256
